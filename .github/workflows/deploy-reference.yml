name: Deploy Reference and Portfolio to GitHub Pages

on:
  push:
    branches: [JobHuntingProject]
    paths:
      - "Project/Reference/**"
      - "Project/Portfolio/**"
      - "Project/Tools/VersionPortfolioAssets.py"
      - ".github/workflows/deploy-reference.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/JobHuntingProject'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare reference and portfolio
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kashipan-pages/portfolio"
          cp -a Project/Reference/. "$RUNNER_TEMP/kashipan-pages/"
          cp -a Project/Portfolio/. "$RUNNER_TEMP/kashipan-pages/portfolio/"
          python3 Project/Tools/VersionPortfolioAssets.py "$RUNNER_TEMP/kashipan-pages/"
          touch "$RUNNER_TEMP/kashipan-pages/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/kashipan-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
