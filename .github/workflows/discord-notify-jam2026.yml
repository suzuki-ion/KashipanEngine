name: Discord Notify (10DaysJam2026)

on:
  push:
    branches:
      - 10DaysJam2026

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n \
            --argjson event "$(cat "$GITHUB_EVENT_PATH")" \
            --arg title "10DaysJam2026 に push されました" \
            '
            ($event.commits // []) as $commits |
            {
              embeds: [{
                title: $title,
                url: $event.compare,
                color: 5814783,
                author: { name: $event.pusher.name },
                fields: (
                  $commits
                  | .[0:10]
                  | map({
                      name: ((.id[0:7]) + " - " + .author.name),
                      value: (.message | split("\n")[0] | .[0:200]),
                      inline: false
                    })
                )
              }]
            }
            ')

          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
