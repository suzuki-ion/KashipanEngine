<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>KashipanEngine プロジェクトランチャー</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>

<header>
  <h1>KashipanEngine</h1>
  <p>プロジェクトランチャー</p>
</header>

<main>
  <div class="section-title">プロジェクト</div>
  <div id="project-list"></div>
</main>

<footer>
  <div class="row">
    <button id="open" class="primary" disabled>開く</button>
    <button id="refresh">更新</button>
  </div>
  <div class="row">
    <input type="text" id="new-name" placeholder="新規プロジェクト名" spellcheck="false" autocomplete="off">
    <button id="create" disabled>作成</button>
  </div>
  <div id="status"></div>
</footer>

<script src="launcher.js"></script>
</body>
</html>
